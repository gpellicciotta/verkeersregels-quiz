<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verkeersregels Quiz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="app">

  <section id="screen-start" class="screen">
    <h1>Verkeersregels Quiz</h1>
    <p>Oefen voor je theoretisch rijexamen: 20 vragen over verkeersborden en verkeersregels.</p>
    <label for="player-name">Naam (optioneel)</label>
    <input type="text" id="player-name" placeholder="Bv. Jef">
    <button id="btn-start" class="btn-primary">Start quiz</button>
    <p id="start-error" class="error hidden"></p>
  </section>

  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-header">
      <span id="quiz-progress">Vraag 1/20</span>
      <span id="quiz-score">Score: 0</span>
    </div>
    <div class="progress-bar"><div id="progress-fill"></div></div>

    <h2 id="question-text"></h2>
    <div id="question-image-wrap" class="hidden">
      <img id="question-image" alt="Verkeersbord">
    </div>

    <div id="options" class="options"></div>

    <div id="explanation" class="explanation hidden"></div>

    <button id="btn-next" class="btn-primary hidden">Volgende vraag</button>
  </section>

  <section id="screen-result" class="screen hidden">
    <h1>Resultaat</h1>
    <p id="result-summary"></p>

    <div class="result-actions no-print">
      <button id="btn-print" class="btn-secondary">Printen / opslaan als PDF</button>
      <button id="btn-restart" class="btn-primary">Opnieuw spelen</button>
    </div>

    <table id="result-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Vraag</th>
          <th>Jouw antwoord</th>
          <th>Juist antwoord</th>
          <th>Resultaat</th>
        </tr>
      </thead>
      <tbody id="result-table-body"></tbody>
    </table>
  </section>

</main>

<script src="js/app.js"></script>
</body>
</html>
